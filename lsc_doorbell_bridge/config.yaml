name: LSC Doorbell Bridge Test
description: Tuya doorbell events with configurable snapshots, battery, power mode and a retention-managed photo archive.
version: "1.0.1"
slug: lsc_doorbell_bridge_test
url: https://github.com/NKSP2026/lsc-doorbell-event-bridge
stage: stable
startup: application
boot: auto
init: false
arch:
  - amd64
  - aarch64
services:
  - mqtt:need
homeassistant_api: true
hassio_api: true
hassio_role: default
ingress: true
ingress_port: 8099
ingress_entry: /
panel_icon: mdi:doorbell-video
panel_title: LSC Doorbell
watchdog: http://[HOST]:8099/health
options:
  access_id: ""
  access_secret: ""
  subscription_name: ""
  data_center: central_europe
  environment: production
  devices:
    - device_id: ""
      name: Doorbell
      camera_entity: ""
  event_hold_seconds: 5
  dedupe_seconds: 8
  snapshot_delay_seconds: 2
  snapshot_timeout_seconds: 20
  snapshot_on_press: true
  snapshot_on_motion: true
  snapshot_periodic_enabled: false
  snapshot_refresh_minutes: 15
  snapshot_retention_days: 2
  tls_allow_insecure: true
  debug_payloads: false
  log_level: info
  webui_language: en
schema:
  access_id: str
  access_secret: password
  subscription_name: str
  data_center: list(china|america|central_europe|india)
  environment: list(production|test)
  devices:
    - device_id: str
      name: str
      camera_entity: str
  event_hold_seconds: "float(1,60)"
  dedupe_seconds: "float(0,120)"
  snapshot_delay_seconds: "float(0,30)"
  snapshot_timeout_seconds: "float(5,60)"
  snapshot_on_press: bool
  snapshot_on_motion: bool
  snapshot_periodic_enabled: bool
  snapshot_refresh_minutes: "float(1,1440)"
  snapshot_retention_days: "int(2,3650)"
  tls_allow_insecure: bool
  debug_payloads: bool
  log_level: list(debug|info|warning|error)
  webui_language: list(en|it|de|fr|es)
